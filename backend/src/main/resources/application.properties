# FocusFlow Application Configuration

# Server Port
server.port=8080

# Optional local properties file for secret credentials (ignored in Git)
spring.config.import=optional:classpath:application-local.properties

# Database Configuration (MySQL)
# createDatabaseIfNotExist=true ensures the database focusflow_db is auto-created if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/focusflow_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:YOUR_MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update' automatically updates table schemas to match Java entities without deleting existing data
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.focusflow=INFO
logging.level.org.hibernate.SQL=DEBUG


# Python ML Microservice Configuration
focusflow.ml.service.url=${ML_SERVICE_URL:http://localhost:8000}
focusflow.ml.service.connect-timeout-ms=${ML_CONNECT_TIMEOUT_MS:2000}
focusflow.ml.service.read-timeout-ms=${ML_READ_TIMEOUT_MS:3000}
focusflow.ml.service.enabled=${ML_SERVICE_ENABLED:true}


# FocusFlow 2.0 Security & JWT Configuration
focusflow.security.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
focusflow.security.jwt.access-token-expiration-ms=${JWT_EXPIRATION_MS:900000}
focusflow.security.jwt.refresh-token-expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:604800000}
focusflow.security.cookie.secure=${COOKIE_SECURE:false}


# FocusFlow 2.0 Administrator Bootstrap Configuration
focusflow.admin.email=${ADMIN_EMAIL:admin@focusflow.com}
focusflow.admin.password=${ADMIN_PASSWORD:AdminSecret123!}
focusflow.admin.name=${ADMIN_NAME:System Administrator}

# Spring Boot Actuator & Micrometer Prometheus Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=FocusFlow
management.metrics.distribution.percentiles-histogram.http.server.requests=true
